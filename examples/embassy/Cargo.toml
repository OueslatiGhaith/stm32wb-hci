[package]
name = "stm32wb55-embassy"
edition = "2024"
version = "0.1.0"

[dependencies]
aligned = "0.4.3"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"
defmt.workspace = true
defmt-rtt = "1.1.0"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32wb55rg",
    "time-driver-any",
    "memory-x",
    "exti",
    "executor-thread",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
bt-hci.workspace = true
bt-hci-transport.workspace = true
embedded-io.workspace = true
embassy-futures = "0.1.2"
stm32wb-hci = { path = "../../crates/stm32wb-hci", features = ["defmt"] }

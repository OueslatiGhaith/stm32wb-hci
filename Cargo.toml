[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
# Keep ordinary builds of the no_std library independent of the host-only
# compliance CLI and proc-macro support crates.
default-members = ["crates/stm32wb-hci"]

[workspace.dependencies]
bt-hci = "0.10.0"
bt-hci-transport = "0.1.0"
defmt = "1"
embedded-io = "0.7.1"
proc-macro2 = "1"
stm32wb-hci-schema = { version = "0.1.0", path = "crates/stm32wb-hci-schema" }
syn = "2"
toml = "1"

[profile.dev]
debug = 2

[profile.release]
debug = 2

[package]
name = "stm32wb-compliance"
edition = "2024"
publish = false
description = "Firmware API compliance checks for stm32wb-hci"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
cargo_metadata.workspace = true
clap = { version = "4", features = ["derive"] }
proc-macro2.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stm32wb-hci-schema.workspace = true
syn = { workspace = true, features = ["full", "parsing", "visit"] }
thiserror = "2"
toml.workspace = true
tree-sitter = "0.26"
tree-sitter-c = "0.24"

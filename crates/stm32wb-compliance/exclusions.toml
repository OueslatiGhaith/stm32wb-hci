# stm32wb-compliance exclusion policy.
#
# Every exclusion declares a scope, numeric wire code, firmware selector, and
# reviewable reason. `firmware = "*"` selects every declared firmware; an exact
# version such as `"1.17.0"` selects only that version.
#
# System-channel events are inventoried from CubeWB's tagged `shci.h` header.
# The two 802.15.4-specific notifications below are deliberately outside this
# Bluetooth HCI crate. The checker rejects overlaps, unknown firmware versions,
# and exclusions which no longer suppress a real difference.
[[exclusions]]
scope = "event"
code = 0x9203
firmware = "*"
reason = "OpenThread NVM notification is outside this Bluetooth HCI crate"

[[exclusions]]
scope = "event"
code = 0x9208
firmware = "*"
reason = "concurrent 802.15.4 notification is outside this Bluetooth HCI crate"

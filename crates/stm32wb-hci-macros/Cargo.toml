[package]
name = "stm32wb-hci-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for stm32wb-hci declarative protocol schemas"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OueslatiGhaith/stm32wb-hci"

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote = "1"
stm32wb-hci-schema.workspace = true
syn = { workspace = true, features = ["visit"] }

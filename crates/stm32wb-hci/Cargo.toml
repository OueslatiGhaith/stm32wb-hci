[package]
name = "stm32wb-hci"
build = "build.rs"
edition = "2024"
version = "0.18.0"
authors = [
    "Daniel Gallagher <pdanielgallagher@gmail.com>",
    "Ghaith Oueslati <ghaith.oueslati@enis.tn>",
]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
description = "Implementation of the Bluetooth HCI for the STM32WB family"
keywords = ["ble", "bluetooth", "stm32"]
license = "MIT/Apache-2.0"
repository = "https://github.com/OueslatiGhaith/stm32wb-hci"
readme = "../../README.md"
exclude = ["tests"]

[dependencies]
bitflags = "2"
bt-hci.workspace = true
defmt = { workspace = true, optional = true }
embedded-io.workspace = true
embedded-io-async = "0.7.0"
stm32wb-hci-macros = { version = "0.1.0", path = "../stm32wb-hci-macros" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[build-dependencies]
stm32wb-hci-schema.workspace = true

[features]
default = ["fw_0_24_0"]
defmt = ["dep:defmt", "bt-hci/defmt"]
fw_0_15_0 = []
fw_0_16_0 = []
fw_0_17_0 = []
fw_0_17_1 = []
fw_0_17_2 = []
fw_0_17_3 = []
fw_0_18_0 = []
fw_0_19_0 = []
fw_0_19_1 = []
fw_0_20_0 = []
fw_0_21_0 = []
fw_0_22_0 = []
fw_0_22_1 = []
fw_0_23_0 = []
fw_0_24_0 = []

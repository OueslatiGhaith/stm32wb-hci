[package]
name = "stm32wb-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Normalized STM32WB and STM32WBA wireless-interface catalogs shared by stm32wb-hci tooling"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OueslatiGhaith/stm32wb-hci"
readme = "catalog/README.md"
categories = ["embedded"]
keywords = ["ble", "bluetooth", "stm32", "hci"]

[dependencies]
itertools = "0.15"
serde = { version = "1", features = ["derive"] }
serde_with = "3"
toml = "1"
winnow = "1"

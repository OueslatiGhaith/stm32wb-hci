# The STM32WB wireless-interface catalog, layer 3: curated facts.
#
# Each annotation refines one entry of stm32wb.toml and must cite the evidence
# it rests on. `stm32wb-catalog-extract audit` rejects annotations whose
# target disappeared, that fill a layout the extractor now derives (stale),
# or that contradict an extracted layout without `override = true`.

# System events whose payload is a C enum. The wire width of an enum is an
# ABI property that the generated C does not state.

[[annotations]]
event = "SHCI_SUB_EVT_CODE_READY"
source = "AAPCS32 section 7.1.3: enumerations on arm-none-eabi use the smallest container holding their values, and SHCI_SysEvt_Ready_Rsp_t's values (0x00..=0x11) fit one byte; stm32wb-hci 0.19 decodes this payload as one byte on hardware"
reason = "sysevt_ready_rsp is declared with an enum type"
payload = ["sysevt_ready_rsp: u8"]

[[annotations]]
event = "SHCI_SUB_EVT_ERROR_NOTIF"
source = "AAPCS32 section 7.1.3: enumerations on arm-none-eabi use the smallest container holding their values, and SCHI_SystemErrCode_t's values (0..=200) fit one byte"
reason = "errorCode is declared with an enum type"
payload = ["errorCode: u8"]

# System events shci.h documents without parameters.

[[annotations]]
event = "SHCI_SUB_EVT_NVM_END_WRITE"
source = "shci.h documents SHCI_SUB_EVT_NVM_END_WRITE with a description and no parameters, while every event with parameters is documented on its payload structure"
reason = "no payload structure exists to extract"
payload = []

[[annotations]]
event = "SHCI_SUB_EVT_NVM_END_ERASE"
source = "shci.h documents SHCI_SUB_EVT_NVM_END_ERASE with a description and no parameters, while every event with parameters is documented on its payload structure"
reason = "no payload structure exists to extract"
payload = []

# System events for the other wireless stacks sharing the system channel.

[[annotations]]
event = "SHCI_SUB_EVT_THREAD_NVM_RAM_UPDATE"
source = "shci.h: OpenThread NVM RAM section update notification"
reason = "OpenThread is outside this Bluetooth HCI crate"
exclude = true

[[annotations]]

# Core commands whose returns no catalog layout describes.

[[annotations]]
command = "hci_read_local_supported_codecs_v2"
source = "ble_hci_le.h hci_read_local_supported_codecs_v2 returns Num_Supported_Standard_Codecs, Standard_Codec, Num_Supported_Vendor_Specific_Codecs, and Vendor_Specific_Codec, while ble_types.h hci_read_local_supported_codecs_v2_rp0 declares only Status, Num_Supported_Standard_Codecs, and Standard_Codec; Core Specification v5.4, Vol 4, Part E, 7.4.8"
reason = "ST's return structure lacks the vendor-specific codecs its function returns, so no layout of the return is derivable"
exclude = true

[[annotations]]
command = "hci_read_local_supported_codec_capabilities"
source = "ble_types.h hci_read_local_supported_codec_capabilities_rp0: Codec_Capabilities[250]; Core Specification v5.4, Vol 4, Part E, 7.4.10: Num_Codec_Capabilities capabilities, each prefixed by its length"
reason = "the capabilities are a list of length-prefixed entries, which ST's fixed 250-byte member does not describe and no catalog layout can"
exclude = true

# The STM32WBA wireless-interface catalog, layer 3: curated facts.
#
# Each annotation refines one entry of stm32wba.toml and must cite the
# evidence it rests on, as in annotations.toml, which documents the format.
# `stm32wb-catalog-extract audit --platform stm32wba` rejects annotations
# whose target disappeared, that fill a layout the extractor now derives
# (stale), or that contradict an extracted layout without `override = true`.

# Commands carrying a UUID union. ble_types.h declares each UUID as a union
# of a 16-bit and a 128-bit UUID, packed after the member selecting it, and
# STM32CubeWBA ships no code filling it; the selector's doc comment names the
# alternatives. The structures are the same in every release from 1.0.0 on.

[[annotations]]
command = "aci_gatt_add_service"
source = "ble_gatt_aci.h aci_gatt_add_service: \"@param Service_UUID_Type UUID type: 0x01 = 16 bits UUID while 0x02 = 128 bits UUID\"; ble_types.h aci_gatt_add_service_cp0 and _cp1: Service_UUID_Type, Service_UUID (Service_UUID_t, a union of uint16_t and uint8_t[16]), Service_Type, Max_Attribute_Records"
reason = "Service_UUID_t is a union whose selector only the doc comment names"
params = [
    "Service_UUID_Type: u8",
    "Service_UUID: union(Service_UUID_Type) { 1 => 2, 2 => 16 }",
    "Service_Type: u8",
    "Max_Attribute_Records: u8",
]


[package]
name = "stm32wb-compliance"
version = "0.1.0"
edition = "2024"
publish = false
description = "Firmware API compliance checks for stm32wb-hci"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
thiserror = "2"
toml = "1"
tree-sitter = "0.26"
tree-sitter-c = "0.24"

name: CI

on: [pull_request, push]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude stm32wb55-embassy --all-targets -- -D warnings
      - name: Test host support crates
        run: cargo test -p stm32wb-hci-schema -p stm32wb-hci-macros -p stm32wb-compliance

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          target: thumbv7em-none-eabihf
      - name: Build every declared firmware feature
        shell: bash
        run: |
          set -euo pipefail
          firmwares="$(cargo run --locked -q -p stm32wb-compliance -- list-supported)"
          test -n "$firmwares"
          for firmware in $firmwares; do
            cargo build -p stm32wb-hci --no-default-features --features="$firmware,stack-full-extended" --release --target=thumbv7em-none-eabihf
            cargo build -p stm32wb-hci --no-default-features --features="$firmware,stack-full-extended,defmt" --release --target=thumbv7em-none-eabihf
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          target: thumbv7em-none-eabihf
      - name: Test every declared firmware and stack profile
        shell: bash
        run: |
          set -euo pipefail
          firmwares="$(cargo run --locked -q -p stm32wb-compliance -- list-supported)"
          profiles="$(cargo run --locked -q -p stm32wb-compliance -- list-profiles)"
          test -n "$firmwares"
          test -n "$profiles"
          for firmware in $firmwares; do
            for profile in $profiles; do
              if ! cargo test --locked --verbose -p stm32wb-hci --lib --tests --no-default-features --features="$firmware,$profile"; then
                printf 'test failed: %s,%s\n' "$firmware" "$profile" >&2
                exit 1
              fi
            done
          done

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          target: thumbv7em-none-eabi
      - run: cargo check -p stm32wb55-embassy --target thumbv7em-none-eabi

  firmware-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev
      - name: Fetch STM32CubeWB tags without checking out a worktree
        run: git clone --filter=blob:none --no-checkout --tags https://github.com/STMicroelectronics/STM32CubeWB.git STM32CubeWB
      - name: Check every declared release, MCU family, and stack profile against CubeWB
        run: cargo run -p stm32wb-compliance -- check --all-supported --deny

name: CI

on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
      - run: cargo build --release --target=thumbv7em-none-eabihf
      - run: cargo build --features=defmt --release --target=thumbv7em-none-eabihf

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
      - run: cargo test --verbose -p stm32wb-hci -p stm32wb-hci-macros

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Test every distinct release and stack profile
        run: |
          targets="$(cargo run -q -p stm32wb-catalog-extract -- targets)
          $(cargo run -q -p stm32wb-catalog-extract -- targets --platform stm32wba)"
          for features in $targets; do
            echo "::group::$features"
            cargo test --lib --no-default-features --features "$features"
            echo "::endgroup::"
          done

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: thumbv7em-none-eabi
      - run: cargo check -p stm32wb55-embassy --target thumbv7em-none-eabi

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev
      - run: cargo test -p stm32wb-catalog -p stm32wb-catalog-extract
      - name: Audit the catalog annotations
        run: cargo run -p stm32wb-catalog-extract -- audit
      - name: Audit the STM32WBA catalog annotations
        run: cargo run -p stm32wb-catalog-extract -- audit --platform stm32wba

  catalog-reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev
      - name: Fetch STM32CubeWB tags without a worktree
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/STMicroelectronics/STM32CubeWB.git STM32CubeWB
          git -C STM32CubeWB fetch --tags --filter=blob:none
      - name: Re-extract the catalog from the tagged sources
        run: cargo run -p stm32wb-catalog-extract -- check
